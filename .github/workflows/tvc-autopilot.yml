name: TVC Fusion Auto-Pilot

# Odpala auto_fusion.py + paper_bot.py refresh co 15 minut, w chmurze GitHub —
# nie wymaga włączonego komputera. Zero kredytów Claude (czysty Python).

on:
  # Wewnętrzny cron GitHuba usunięty — niewiarygodny przy interwałach <15 min
  # (potrafił nie odpalić się godzinami). Cykliczność co 5 min zapewnia teraz
  # zewnętrzny, niezawodny trigger z cron-job.org wołający workflow_dispatch.
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions LUB z zewnętrznego crona

concurrency:
  group: tvc-fusion
  cancel-in-progress: false   # nigdy nie odpalaj dwóch cykli naraz (chroni SQLite przed race condition)

permissions:
  contents: write   # pozwala workflow'owi commitować i pushować z powrotem do repo

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HOME: /home/runner/home-clone
      GITHUB_TOKEN: ${{ secrets.GIST_PAT }}
      TVC_GIST_ID: ${{ secrets.TVC_GIST_ID }}
      # v0.3 — powiadomienia Telegram (opcjonalne: bez sekretów bot działa bez alertów)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repo (standard path)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link checkout do $HOME/Claude/TVCFusion (skrypty używają Path.home())
        run: |
          mkdir -p /home/runner/home-clone/Claude
          ln -s "$GITHUB_WORKSPACE" /home/runner/home-clone/Claude/TVCFusion

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install optional deps
        run: pip install certifi ccxt

      - name: Cicha weryfikacja Telegram (getMe+getChat, bez wysyłania wiadomości)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 paper_bot.py telegram-test || true

      # Poranny shortlist — algorytmiczny screener MEXC (zastąpił Cowork task, który wymagał
      # obudzonego Maca). Generuje raz dziennie po 05:00 UTC; poza tym oknem jest no-op.
      # Nigdy nie wywraca cyklu (exit 0). Wynik trafia do fusion_latest.json przez auto_fusion.
      - name: Crypto Picks (raz dziennie, MEXC screener + Telegram)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 auto_picks.py --telegram

      - name: Run auto_fusion (fresh algorytmiczne sygnały)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 auto_fusion.py

      - name: Otwórz nowe pozycje z fresh sygnałów (long i short)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 paper_bot.py open

      - name: Refresh paper positions + upload do Gist
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 paper_bot.py refresh

      - name: Commit zaktualizowany stan z powrotem do repo
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        env:
          GIT_EDITOR: "true"   # no-op edytor — git rebase --continue nigdy nie ma czekać na input w CI
        run: |
          git config user.name "tvc-autopilot"
          git config user.email "autopilot@tvcfusion.local"
          git add fusion_*.json paper_trades.db crypto_picks.json 2>/dev/null || git add fusion_*.json paper_trades.db
          if git diff --cached --quiet; then
            echo "Brak zmian do commitu."
            exit 0
          fi
          git commit -m "auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry z rebase — chroni przed race condition gdy dwa runy nachodzą na siebie w czasie.
          # fusion_*.json jest w całości nadpisywany co cykl, a paper_trades.db to binarny SQLite —
          # git NIGDY nie zmerguje ich automatycznie na poziomie treści, więc nakładający się drugi
          # writer zawsze da realny konflikt rebase, nie tylko "non-fast-forward". Dlatego przy
          # konflikcie rozwiązujemy go automatycznie na korzyść danych z TEGO przebiegu (--theirs
          # w kontekście rebase = commit który właśnie replayujemy, czyli nasz świeży auto-update) —
          # to najświeższe policzone dane, i tak zostaną nadpisane kolejnym cyklem za ~5 min.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (próba $i)."
              exit 0
            fi
            echo "Push odrzucony (próba $i) — pull --rebase i ponawiam..."
            if git pull --rebase origin main; then
              echo "Rebase czysty, próbuję push ponownie."
            else
              echo "Konflikt w rebase — auto-resolve na korzyść danych z tego przebiegu..."
              git checkout --theirs -- fusion_*.json 2>/dev/null || true
              git checkout --theirs -- paper_trades.db 2>/dev/null || true
              git checkout --theirs -- crypto_picks.json 2>/dev/null || true
              git add -A
              if git rebase --continue; then
                echo "Konflikt rozwiązany automatycznie."
              else
                echo "Nie udało się rozwiązać konfliktu automatycznie — przerywam rebase, ponawiam od zera."
                git rebase --abort || true
              fi
            fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "Push nie powiódł się po 5 próbach."
          exit 1

      # v0.3 — alert awarii: jeśli którykolwiek krok padł, Telegram dostaje wiadomość
      # z linkiem do logu. Bez sekretów krok jest cichym no-opem.
      - name: Alert Telegram przy awarii cyklu
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram — pomijam alert."; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🚨 <b>TVC Autopilot — cykl NIE POWIÓDŁ SIĘ</b>
          Run #${{ github.run_number }} · $(date -u +%H:%M) UTC
          Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
