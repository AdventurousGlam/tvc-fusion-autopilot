name: TVC Fusion Auto-Pilot

# Odpala auto_fusion.py + paper_bot.py refresh co 15 minut, w chmurze GitHub —
# nie wymaga włączonego komputera. Zero kredytów Claude (czysty Python).
#
# KROK 2 (wersja z prywatnym stanem): repo jest PUBLICZNE, więc stan bota i wyniki
# (paper_trades.db, pozycje, historia picków itd.) NIE są już commitowane do repo.
# Przebieg: pull stanu z prywatnego gista (tvc_state.py) -> kroki bota -> push stanu
# do gista -> do repo trafiają WYŁĄCZNIE pliki z listy publicznej (patrz krok
# "Publikuj do repo"). Gdy gist jest niedostępny, przebieg kończy się błędem PRZED
# jakimkolwiek zapisem: nie nadpisuje stanu i nie commituje niczego do repo.
# Wyjście kroków bota jest zbierane do prywatnego logu (ci_quiet.sh), bo log Actions
# publicznego repo jest publiczny, a skrypty drukują equity i PnL.
# Powrót do poprzedniej wersji: ROLLBACK.md (workflow tvc-state-syncback.yml).

on:
  # Wewnętrzny cron GitHuba usunięty — niewiarygodny przy interwałach <15 min
  # (potrafił nie odpalić się godzinami). Cykliczność co 5 min zapewnia teraz
  # zewnętrzny, niezawodny trigger z cron-job.org wołający workflow_dispatch.
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions LUB z zewnętrznego crona

concurrency:
  group: tvc-fusion
  cancel-in-progress: false   # nigdy nie odpalaj dwóch cykli naraz (chroni SQLite przed race condition)

permissions:
  contents: write   # pozwala workflow'owi commitować i pushować z powrotem do repo
  actions: read     # odczyt historii przebiegów — wyciszanie powtarzanego alarmu infra

jobs:
  run:
    # Przypięte zamiast ubuntu-latest — GitHub przenosi ubuntu-latest na Ubuntu 26
    # od 19.10.2026. Przypięcie daje czas na kontrolowaną migrację.
    runs-on: ubuntu-24.04
    env:
      HOME: /home/runner/home-clone
      GITHUB_TOKEN: ${{ secrets.GIST_PAT }}
      TVC_GIST_ID: ${{ secrets.TVC_GIST_ID }}
      # Krok 2: PRYWATNY gist ze stanem bota (osobny od TVC_GIST_ID, który zasila terminal).
      # Do klonowania/pushu używany jest GITHUB_TOKEN (= GIST_PAT, zakres "gist").
      TVC_STATE_GIST_ID: ${{ secrets.TVC_STATE_GIST_ID }}
      TVC_LOG_DIR: /home/runner/tvc_logs
      # Które pliki wolno wypchnąć do PUBLICZNEGO repo (obok fusion_<data UTC>.json).
      # results.json zasila stronę results.html (czyta go z raw.githubusercontent.com).
      # "0" = results.json też zostaje tylko w gist-cie (strona przestanie się odświeżać).
      TVC_PUBLISH_RESULTS_JSON: "1"
      # v4.1 — strojone progi i wagi. Repozytorium jest publiczne, te liczby nie.
      # Bez tego sekretu skrypty działają na zachowawczych wartościach zastępczych,
      # a paper_bot odmawia otwierania pozycji (patrz tvc_params.py).
      TVC_PARAMS: ${{ secrets.TVC_PARAMS }}
      # v0.3 — powiadomienia Telegram (opcjonalne: bez sekretów bot działa bez alertów)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENMARKET_API_KEY: ${{ secrets.OPENMARKET_API_KEY }}
      # v4.4 — tryb edukacyjny: żadnych sygnałów/picków/alertów na kanałach publicznych
      # (paper_bot, auto_picks, pump_radar). Kanał FREE dostaje tylko omówienie po
      # zamknięciu transakcji. "0" = stare zachowanie (nie zalecane).
      TVC_EDUCATION_ONLY: "1"
    steps:
      - name: Checkout repo (standard path)
        uses: actions/checkout@v7
        with:
          # Było fetch-depth: 0 — klonowało CAŁĄ historię (158 MB, 11k commitów)
          # co 5 minut. 20 commitów w zupełności wystarcza do pull --rebase
          # w kroku commitującym, a przebieg jest wyraźnie krótszy.
          fetch-depth: 20

      - name: Link checkout do $HOME/Claude/TVCFusion (skrypty używają Path.home())
        run: |
          mkdir -p /home/runner/home-clone/Claude
          ln -s "$GITHUB_WORKSPACE" /home/runner/home-clone/Claude/TVCFusion

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install optional deps
        run: pip install --retries 3 --timeout 30 certifi ccxt yfinance pandas

      # Krok 2: stan z prywatnego gista. Brak sekretu / brak sieci / rozjazd sum =
      # błąd tego kroku, wszystkie następne kroki (poza alertem) są pomijane.
      - name: Pobierz stan z prywatnego gista
        id: state
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: |
          mkdir -p "$TVC_LOG_DIR"
          python3 tvc_state.py pull --state-dir /home/runner/tvc_state

      - name: Cicha weryfikacja Telegram (getMe+getChat, bez wysyłania wiadomości)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh telegram_test python3 paper_bot.py telegram-test || true

      # Poranny shortlist — algorytmiczny screener MEXC (zastąpił Cowork task, który wymagał
      # obudzonego Maca). Generuje raz dziennie po 05:00 UTC; poza tym oknem jest no-op.
      # Nigdy nie wywraca cyklu (exit 0). Wynik trafia do fusion_latest.json przez auto_fusion.
      - name: Crypto Picks (raz dziennie, MEXC screener + Telegram)
        id: picks
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh auto_picks python3 auto_picks.py --telegram

      # Rozliczenie picków: co z nich wyszło. Dopisuje dzisiejsze do archiwum
      # i domyka te sprzed 1-7 dni danymi z MEXC. Przy pierwszym przebiegu sam
      # odtwarza historię z commitów crypto_picks.json (41 dni wstecz).
      # Jak picks — awaria nie jest awarią cyklu, to warstwa obserwacyjna.
      - name: Picks tracker (skuteczność picków)
        id: picks_tracker
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh picks_tracker python3 picks_tracker.py

      # Publiczne wyniki paper tradingu -> results.json dla results.html.
      # Skrypt SAM blokuje zapis do STATS_PUBLIC_FROM (12.11.2026, rejestr pkt 6):
      # do tego dnia tylko wypisuje policzone liczby i kończy bez pliku. Od 12.11
      # zacznie go generować, a strona wypełni się bez niczyjego udziału.
      # Jak picks — awaria nie przerywa cyklu, to warstwa publikacyjna.
      - name: Eksport wyników (results.json, publikacja od 12.11)
        id: export_results
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh export_results python3 export_results.py

      # Pump Radar — skan całego rynku perpów (HL + MEXC) pod krótkoterminowe pumpy:
      # OI surge / funding / kompresja / wieloryby HL / zapłon wolumenu / listingi.
      # radar_cache.json (serie cen/OI, fills) żyje w actions/cache, nie w repo — za duży
      # na commit co 5 min. Wyniki (pump_radar.json, alerty z track recordem) są commitowane.
      - name: Pump Radar cache (restore)
        uses: actions/cache@v6
        with:
          path: /home/runner/home-clone/Claude/TVCFusion/radar_cache.json
          key: radar-cache-${{ github.run_id }}
          restore-keys: |
            radar-cache-

      - name: Pump Radar (skan rynku + track record + Telegram przy HIGH)
        id: radar
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh pump_radar python3 pump_radar.py --telegram

      - name: Correlation Matrix (daily, Binance + Yahoo Finance)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh correlation python3 correlation_matrix.py || true

      - name: Polymarket Predictions (snapshot + outcome check)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh polymarket python3 polymarket_predictions.py || true

      # Trzy kroki poniżej mają continue-on-error: pojedynczy timeout API nie może
      # zabijać całego cyklu razem z commitem. Status każdego trafia do kroku
      # "Bilans cyklu", który decyduje o alercie i zapisuje autopilot_health.json.
      - name: Run auto_fusion (fresh algorytmiczne sygnały)
        id: fusion
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh auto_fusion python3 auto_fusion.py

      - name: Otwórz nowe pozycje z fresh sygnałów (long i short)
        id: open
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh paper_open python3 paper_bot.py open

      - name: Refresh paper positions + upload do Gist
        id: refresh
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh paper_refresh python3 paper_bot.py refresh

      # v1.0 — Content Engine: generuje posty na X + LinkedIn + YouTube z danych bota.
      # Odpala się po paper_bot refresh, żeby mieć świeże dane o zamkniętych trade'ach.
      # Wynik: content_queue.json + opcjonalny Telegram digest do osobistego czatu.
      # v4.2 (13.10.2026) — STRAŻNIK UCZCIWOŚCI WYJŚĆ.
      # test_no_peeking.py sprawdza, czy decyzja nie dotknęła danych z przyszłości
      # i czy cena wyjścia w ogóle istniała. Tryb offline jest darmowy (bez sieci),
      # więc leci w KAŻDYM cyklu. Tryb --online robi setki zapytań do Binance,
      # więc raz dziennie — inaczej wpadamy w ten sam rate limit co przy heatmapie.
      # continue-on-error: wykrycie ma krzyczeć, a nie zabijać zbierania danych.
      - name: Strażnik — brak przecieku przyszłości
        id: nopeek
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: |
          HOUR=$(date -u +%H); MIN=$(date -u +%M)
          if [ "$HOUR" = "04" ] && [ "$MIN" -lt "15" ]; then
            # v4.3.2 (14.10.2026): --days 7 zamiast całej historii.
            # Bez tego przebieg rósł do ~7 min (zapytanie o świece na każdą ze
            # 101 pozycji) i nakładał się na następny cykl crona, co 14.10
            # wywaliło pusha i dało alarm infrastruktury o 04:11 i 04:20 UTC.
            # Pełne skanowanie historii robimy ręcznie: --online --days 0.
            echo "=== test online, okno 7 dni (raz dziennie) ==="
            bash ci_quiet.sh nopeek_online timeout 150 python3 test_no_peeking.py --online --days 7
          else
            bash ci_quiet.sh nopeek python3 test_no_peeking.py
          fi

      - name: Alarm gdy strażnik wykrył przeciek
        if: steps.nopeek.outcome == 'failure'
        continue-on-error: true
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🚨 <b>test_no_peeking FAILED</b>%0AWykryto wyjście po cenie, której nie było, albo decyzję z danych z przyszłości.%0ANIE publikuj wyników, dopóki to nie zostanie wyjaśnione.%0ASzczegóły w logu Actions." \
            > /dev/null || true

      - name: Content Engine (generuj posty z danych bota)
        id: cengine
        continue-on-error: true
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: bash ci_quiet.sh content_engine python3 content_engine.py

      # v4.2: kod 2 = content_queue.json do naprawy (np. znaczniki konfliktu gita).
      # 13.10 taka kolejka była cicho traktowana jak pusta i te same propozycje
      # poszły na Telegram trzy razy. Teraz zamiast powtórki dostajesz alarm.
      - name: Alarm gdy kolejka treści jest uszkodzona
        if: steps.cengine.outcome == 'failure'
        continue-on-error: true
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>content_engine przerwany</b>%0Acontent_queue.json jest nieczytelny (prawdopodobnie znaczniki konfliktu gita).%0APropozycje postów NIE zostały wysłane — to celowe, żeby uniknąć powtórki.%0ANapraw plik w repo." \
            > /dev/null || true

      # v1.0 — Weekly Recap: niedzielna kompilacja (X thread + LinkedIn newsletter + YT script).
      # Odpala się raz w tygodniu w niedzielę 18:00-18:14 UTC (20:00-20:14 CEST).
      - name: Weekly Recap (niedzielna kompilacja, ~20:00 CEST)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: |
          DOW=$(date -u +%u)
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$DOW" = "7" ] && [ "$HOUR" = "18" ] && [ "$MIN" -lt "15" ]; then
            echo "=== Weekly Recap (Sunday 18:00-18:14 UTC) ==="
            bash ci_quiet.sh weekly_recap python3 weekly_recap.py
          else
            echo "Not Sunday recap window ($DOW $HOUR:$MIN UTC) — skip."
          fi

      # v0.9.3 — EOD check przeniesiony z Cowork scheduled task (wymagał Maca)
      # do GitHub Actions. Odpala się raz dziennie w oknie 20:00-20:14 UTC
      # (= 22:00-22:14 CEST). Poza tym oknem krok jest no-opem.
      # Zamyka pozycje na SL/TP, drukuje EOD summary + wysyła Telegram alert.
      - name: Paper Bot EOD check (raz dziennie ~22:00 CEST)
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$HOUR" = "20" ] && [ "$MIN" -lt "15" ]; then
            echo "=== EOD window (20:00-20:14 UTC / 22:00-22:14 CEST) ==="
            bash ci_quiet.sh paper_eod python3 paper_bot.py eod
          else
            echo "Poza oknem EOD ($HOUR:$MIN UTC) — pomijam."
          fi

      # Zlicza, które kroki padły, i utrzymuje licznik AWARII Z RZĘDU w
      # autopilot_health.json (plik jest commitowany, więc stan przeżywa między
      # przebiegami). Pojedyncza wpadka = cisza, bo następny cykl za 5 min ją nadrobi.
      - name: Bilans cyklu (autopilot_health.json)
        id: health
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        env:
          R_PICKS:   ${{ steps.picks.outcome }}
          R_RADAR:   ${{ steps.radar.outcome }}
          R_FUSION:  ${{ steps.fusion.outcome }}
          R_OPEN:    ${{ steps.open.outcome }}
          R_REFRESH: ${{ steps.refresh.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, pathlib

          # Kroki decydujące o tym, czy cykl policzył świeże dane.
          # picks/radar są poboczne — ich awaria nie jest awarią cyklu.
          CRITICAL = ["R_FUSION", "R_OPEN", "R_REFRESH"]
          NAMES = {"R_PICKS":"crypto_picks","R_RADAR":"pump_radar","R_FUSION":"auto_fusion",
                   "R_OPEN":"paper_bot open","R_REFRESH":"paper_bot refresh"}

          res  = {k: os.environ.get(k, "skipped") for k in NAMES}
          bad  = [NAMES[k] for k in CRITICAL if res[k] == "failure"]
          soft = [NAMES[k] for k in ("R_PICKS","R_RADAR") if res[k] == "failure"]

          p = pathlib.Path("autopilot_health.json")
          try:
              h = json.loads(p.read_text())
          except Exception:
              h = {}

          streak = int(h.get("consecutive_failures", 0))
          streak = streak + 1 if bad else 0
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")

          h.update({
              "last_run": now,
              "last_run_url": os.environ.get("RUN_URL", ""),
              "steps": {NAMES[k]: res[k] for k in NAMES},
              "failed_critical": bad,
              "failed_soft": soft,
              "consecutive_failures": streak,
          })
          if not bad:
              h["last_ok"] = now
          p.write_text(json.dumps(h, indent=2))

          # Alert dopiero przy 3 awariach z rzędu (~15 min bez świeżych danych).
          alert = bool(bad) and streak >= 3
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"alert={'true' if alert else 'false'}\n")
              f.write(f"streak={streak}\n")
              f.write(f"failed={', '.join(bad) or '-'}\n")
              f.write(f"soft={', '.join(soft) or '-'}\n")

          print(f"kroki: {h['steps']}")
          print(f"krytyczne awarie: {bad or 'brak'} | z rzędu: {streak} | alert: {alert}")
          if soft:
              print(f"poboczne awarie (bez alertu): {soft}")
          PY

      # Krok 2: zapis stanu do PRYWATNEGO gista zamiast commita do repo. Bez --force.
      # Kolejność ma znaczenie: stan idzie do gista PRZED publikacją do repo; jeśli zapis
      # stanu padnie, do repo nic nie wychodzi (krok publikacji ma domyślne if: success()).
      # Nakładanie się przebiegów wyklucza `concurrency: tvc-fusion`; dodatkowo push
      # sprawdza, czy gist nie ruszył się od pobrania (inny pisarz) i wtedy nie nadpisuje.
      - name: Zapisz stan do prywatnego gista
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: python3 tvc_state.py push --state-dir /home/runner/tvc_state --logs-dir "$TVC_LOG_DIR"

      # Do PUBLICZNEGO repo trafia tylko: fusion_<data UTC>.json, autopilot_health.json
      # (status, bez wyników) i — gdy TVC_PUBLISH_RESULTS_JSON=1 — results.json.
      # Commit powstaje w osobnym worktree z origin/main (bez rebase i bez konfliktów:
      # przy odrzuconym pushu bierzemy świeże origin/main i kładziemy plik jeszcze raz).
      - name: Publikuj do repo tylko pliki publiczne
        working-directory: /home/runner/home-clone/Claude/TVCFusion
        run: |
          PUB="fusion_$(date -u +%Y-%m-%d).json autopilot_health.json"
          if [ "${TVC_PUBLISH_RESULTS_JSON:-0}" = "1" ]; then PUB="$PUB results.json"; fi
          git config user.name "tvc-autopilot"
          git config user.email "autopilot@tvcfusion.local"
          WT="$RUNNER_TEMP/pub"
          rm -rf "$WT"
          git worktree prune
          git fetch -q origin main
          git worktree add -q --detach "$WT" origin/main
          for i in 1 2 3 4 5; do
            git -C "$WT" fetch -q origin main || true
            git -C "$WT" reset -q --hard origin/main
            for f in $PUB; do
              [ -f "$f" ] && cp "$f" "$WT/$f"
            done
            for f in $PUB; do
              [ -f "$WT/$f" ] && git -C "$WT" add -- "$f"
            done
            if git -C "$WT" diff --cached --quiet; then
              echo "Brak zmian w plikach publicznych."
              exit 0
            fi
            # Strażnik: do commita wolno tylko pliki z listy publicznej.
            for f in $(git -C "$WT" diff --cached --name-only); do
              case " $PUB " in
                *" $f "*) ;;
                *) echo "!!! $f nie jest na liście publicznej — przerywam bez commita."; exit 1 ;;
              esac
            done
            # Strażnik znaczników konfliktu (jak w poprzedniej wersji).
            BADF=$(git -C "$WT" diff --cached --name-only | while read -r f; do
              grep -lE '^(<<<<<<< |>>>>>>> |=======$)' "$WT/$f" 2>/dev/null
            done) || true
            if [ -n "$BADF" ]; then
              echo "!!! Znaczniki konfliktu w pliku publicznym — nie commituję."
              exit 1
            fi
            git -C "$WT" commit -q -m "auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git -C "$WT" push -q origin HEAD:main; then
              echo "Push OK (próba $i)."
              exit 0
            fi
            echo "Push odrzucony (próba $i) — świeże origin/main i jeszcze raz..."
            sleep $((RANDOM % 8 + 3))
          done
          # Przegrany wyścig o push (np. ręczny commit właścicielki) to nie awaria danych:
          # stan jest już bezpieczny w gist-cie, a plik publiczny zapisze następny cykl.
          git fetch -q origin main || true
          BEHIND=$(git rev-list --count "$(git -C "$WT" rev-parse HEAD)"..origin/main 2>/dev/null || echo 0)
          if [ "${BEHIND:-0}" -gt 0 ]; then
            echo "::warning title=Publikacja odłożona::Kolizja zapisu do repo — plik publiczny zapisze następny cykl. Stan jest bezpieczny w gist-cie."
            exit 0
          fi
          echo "Push do repo nie przeszedł 5 razy, a origin/main się NIE ruszył — realny problem z zapisem."
          exit 1

      # v0.4 — alert dopiero przy 3 krytycznych awariach Z RZĘDU (~15 min bez świeżych
      # danych). Wcześniej odzywał się po każdym pojedynczym cyklu, co przy 288 cyklach
      # na dobę dawało kilka fałszywych alarmów dziennie przy ~1,4% realnych awarii.
      - name: Alert Telegram (dopiero przy 3 awariach z rzędu)
        if: steps.health.outputs.alert == 'true'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram — pomijam alert."; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=🚨 <b>TVC Autopilot — ${{ steps.health.outputs.streak }} cykle z rzędu nieudane</b>
          Padło: ${{ steps.health.outputs.failed }}
          Run #${{ github.run_number }} · $(date -u +%H:%M) UTC
          Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true

      # Awaria infrastruktury (checkout, Python, pip, push) — kroki, których
      # continue-on-error NIE obejmuje. Tu alert ma iść od razu.
      - name: Alert Telegram przy awarii infrastruktury
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 15.10.2026: alarm leciał przy KAŻDYM nieudanym przebiegu, a cron chodzi
          # co 5 minut — jedna awaria trwająca godzinę dawała 12 identycznych
          # wiadomości na Telegramie. Teraz: pierwsza porażka alarmuje od razu,
          # potem przypomnienie co ~godzinę (co 12. porażka z rzędu). Awaria nigdy
          # nie przechodzi niezauważona, ale nie zasypuje skrzynki.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram — pomijam alert."; exit 0
          fi
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tvc-autopilot.yml/runs?branch=main&status=completed&per_page=20" || true)
          # Ile zakończonych przebiegów z rzędu (od najnowszego) padło.
          # Ten przebieg trwa, więc na liście zakończonych go nie ma → +1.
          # Błąd API albo nie-JSON = 1, czyli alarmujemy (lepiej raz za dużo niż cisza).
          STREAK=$(printf '%s' "$RUNS" | python3 -c "import json,sys,itertools;r=json.load(sys.stdin).get('workflow_runs') or [];print(1+sum(1 for _ in itertools.takewhile(lambda x:x.get('conclusion')=='failure',r)))" 2>/dev/null || echo 1)
          echo "Porażki z rzędu: $STREAK"
          if [ "$STREAK" -ne 1 ] && [ $(( STREAK % 12 )) -ne 0 ]; then
            echo "Alarm już wysłany przy pierwszej porażce — wyciszam (przypomnienie co 12.)."
            exit 0
          fi
          # 15.10.2026: komunikat zgadywał "(checkout / Python / pip / push)".
          # Teraz pyta API, KTÓRY krok naprawdę padł — bo alarm bez nazwy kroku
          # zmusza do wchodzenia w logi, a to jest ten rodzaj tarcia, przez który
          # przestaje się czytać alarmy.
          KROK=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                 | python3 -c "import json,sys;r=json.load(sys.stdin).get('jobs') or [];print(next((s['name'] for j in r for s in j.get('steps',[]) if s.get('conclusion')=='failure'),'nieznany krok'))" 2>/dev/null || echo "nieznany krok")
          if [ "$STREAK" -eq 1 ]; then
            OGON="Padł krok: ${KROK}"
          else
            OGON="Padł krok: ${KROK}
          ⏳ Trwa już $STREAK cykli z rzędu — autopilot nie działa od ok. $(( STREAK * 5 / 60 )) h"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=⚠️ <b>TVC Autopilot — awaria infrastruktury</b>
          ${OGON}
          Run #${{ github.run_number }} · $(date -u +%H:%M) UTC
          Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
